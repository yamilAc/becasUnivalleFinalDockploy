services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el entorno de despliegue}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sistema_becas}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el entorno de despliegue}
      DB_NAME: ${MYSQL_DATABASE:-sistema_becas}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el entorno de despliegue}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
    volumes:
      - uploads_data:/app/uploads

  client:
    build: ./client
    restart: always
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
